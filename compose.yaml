name: visagismo-b
x-app: &app
  build: .
  image: visagismo-b:1.1.0
  restart: unless-stopped
  env_file: ${ENV_FILE:-.env}
  environment:
    VISAGISMO_DATA: /data
  volumes:
    - app_data:/data
  read_only: true
  tmpfs:
    - /tmp:size=256m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  mem_limit: 2g
  cpus: 2
services:
  app:
    <<: *app
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    <<: *app
    command: [python, -m, app.worker]
    depends_on:
      app:
        condition: service_healthy
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Configure DOMAIN no arquivo .env}
    ports: ['80:80', '443:443', '443:443/udp']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
volumes:
  app_data:
  caddy_data:
  caddy_config:
