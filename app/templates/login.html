{% extends 'base.html' %}{% block content %}<div class="narrow"><span class="eyebrow">Área profissional</span><h1>Vamos cuidar do próximo estilo.</h1><p class="lead">Entre com o acesso da sua barbearia.</p>{% if error %}<p class="notice error" role="alert">{{error}}</p>{% endif %}<form class="panel stack" method="post" action="/entrar"><div><label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="username" required maxlength="254"></div><div><label for="password">Senha</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256"></div><button type="submit">Entrar no painel</button></form><p class="small">O administrador da instalação cria os acessos. Caso tenha esquecido a senha, solicite a redefinição a ele.</p></div>{% endblock %}
